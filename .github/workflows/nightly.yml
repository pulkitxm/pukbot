name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full-check:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780
        with:
          tool: cargo-deny,cargo-audit,cargo-machete,shellcheck,shfmt,taplo-cli,typos
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked
      - run: cargo audit --deny warnings
      - run: cargo deny check
      - run: cargo machete --with-metadata
      - run: shellcheck install.sh tests/install.sh
      - run: shfmt --diff --indent 4 --case-indent install.sh tests/install.sh
      - run: taplo fmt --check --diff Cargo.toml deny.toml typos.toml
      - run: typos

  future-toolchain:
    name: Rust ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        toolchain: [beta, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  links:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8
        with:
          args: './**/*.md'
          fail: true

  report:
    name: Report
    if: always() && contains(needs.*.result, 'failure')
    needs: [full-check, future-toolchain, links]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const title = 'Nightly CI failed'
            const runUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId
            const body = 'The scheduled full check failed: ' + runUrl
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'nightly' })
            const existing = issues.find((issue) => issue.title === title)
            if (existing) await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            else await github.rest.issues.create({ ...context.repo, title, body, labels: ['nightly'] })
