name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: gitbot-linux-x86_64
            binary: gitbot
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: gitbot-linux-aarch64
            binary: gitbot
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: gitbot-macos-x86_64
            binary: gitbot
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: gitbot-macos-aarch64
            binary: gitbot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: gitbot-windows-x86_64.exe
            binary: gitbot.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-${{ matrix.target }}
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"
      - name: Prepare artifact
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Smoke test artifact
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '"./${ARTIFACT}" --version'
      - name: Smoke test artifact
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '& "./$env:ARTIFACT" --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum gitbot-* >SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Gitbot ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
