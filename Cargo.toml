[package]
name = "pukbot"
version = "0.3.21"
edition = "2024"
rust-version = "1.85"
description = "Post disclosed GitHub comments through the Pukbot GitHub App"
license = "MIT"
repository = "https://github.com/pulkitxm/pukbot"
homepage = "https://gitbot.pulkit.page"
readme = "README.md"
keywords = ["github", "bot", "comments", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.6"
clap_mangen = "0.3"
hex = "0.4"
infer = "0.22"
self-replace = "1.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
