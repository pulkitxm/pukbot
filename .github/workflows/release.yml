name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'README.md'
      - 'install.sh'
      - 'install.ps1'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version and tag
    if: "github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    environment: pukbot-production
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: pukbot
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Choose the next patch version
        id: bump
        run: |
          set -euo pipefail
          current=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          IFS=. read -r major minor patch <<<"${current}"
          for _ in $(seq 1 100); do
            patch=$((patch + 1))
            next="${major}.${minor}.${patch}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -A pukbot-release "https://crates.io/api/v1/crates/pukbot/${next}")
            case "${code}" in
              404) ;;
              200) continue ;;
              *) echo "unexpected crates.io status ${code} for ${next}" >&2; exit 1 ;;
            esac
            if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then continue; fi
            echo "version=${next}" >>"${GITHUB_OUTPUT}"
            echo "tag=v${next}" >>"${GITHUB_OUTPUT}"
            exit 0
          done
          exit 1
      - name: Apply the version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --workspace
          test "$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')" = "${VERSION}"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Commit the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'pukbot[bot]'
          git config user.email '320458784+pukbot[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock
          git commit -m "chore: release v${VERSION}"
      - run: cargo package --locked
      - name: Validate the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          branch="release-candidate/v${VERSION}-${GITHUB_RUN_ID}"
          cleanup() {
            git push origin --delete "refs/heads/${branch}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git push origin HEAD:"refs/heads/${branch}"
          sha=$(git rev-parse HEAD)
          for _ in $(seq 1 120); do
            checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?per_page=100")
            ci=$(jq -r '[.check_runs[] | select(.name == "CI")] | last | .conclusion // "pending"' <<<"${checks}")
            hygiene=$(jq -r '[.check_runs[] | select(.name == "Hygiene")] | last | .conclusion // "pending"' <<<"${checks}")
            if [ "${ci}" = success ] && [ "${hygiene}" = success ]; then
              cleanup
              trap - EXIT
              exit 0
            fi
            for conclusion in "${ci}" "${hygiene}"; do
              case "${conclusion}" in
                success | pending | null | '') ;;
                *) echo "release commit check failed: ${conclusion}" >&2; exit 1 ;;
              esac
            done
            sleep 15
          done
          echo "timed out waiting for release commit checks" >&2
          exit 1
      - name: Publish the release commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Pukbot v${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/v${VERSION}"

  build:
    name: Build ${{ matrix.artifact }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: pukbot-linux-x86_64
            binary: pukbot
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact: pukbot-linux-aarch64
            binary: pukbot
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: pukbot-macos-x86_64
            binary: pukbot
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: pukbot-macos-aarch64
            binary: pukbot
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pukbot-windows-x86_64.exe
            binary: pukbot.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: cargo-auditable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Build release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo auditable build --release --locked --target "${TARGET}"
      - name: Prepare artifact on Unix
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: cp "target/${TARGET}/release/${BINARY}" "${ARTIFACT}"
      - name: Prepare artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: Copy-Item "target/$env:TARGET/release/$env:BINARY" "$env:ARTIFACT"
      - name: Smoke test artifact on Unix
        if: runner.os != 'Windows'
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '"./${ARTIFACT}" --version'
      - name: Smoke test artifact on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: '& "./$env:ARTIFACT" --version'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish-crate:
    name: Publish crate
    needs: version
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          lookup-only: true
      - name: Check crate version
        id: crate
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -A pukbot-release "https://crates.io/api/v1/crates/pukbot/${VERSION}")
          test "${code}" = 200 || test "${code}" = 404
          if [ "${code}" = 404 ]; then echo "publish=true" >>"${GITHUB_OUTPUT}"; fi
      - name: Detect initial publishing credential
        id: initial
        if: steps.crate.outputs.publish == 'true'
        env:
          INITIAL_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "${INITIAL_TOKEN}" ]; then echo "configured=true" >>"${GITHUB_OUTPUT}"; fi
      - id: crates
        if: steps.crate.outputs.publish == 'true' && steps.initial.outputs.configured != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
      - name: Publish to crates.io
        if: steps.crate.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates.outputs.token }}
        run: cargo publish --locked

  release:
    name: Publish GitHub release
    needs: [version, build, publish-crate]
    runs-on: ubuntu-latest
    environment: pukbot-production
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: pukbot
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          merge-multiple: true
      - name: Generate completion and manual artifacts
        run: |
          chmod +x dist/pukbot-linux-x86_64
          dist/pukbot-linux-x86_64 completions bash >dist/pukbot-completions.bash
          dist/pukbot-linux-x86_64 completions zsh >dist/pukbot-completions.zsh
          dist/pukbot-linux-x86_64 completions fish >dist/pukbot-completions.fish
          dist/pukbot-linux-x86_64 completions elvish >dist/pukbot-completions.elvish
          dist/pukbot-linux-x86_64 completions powershell >dist/pukbot-completions.ps1
          dist/pukbot-linux-x86_64 man >dist/pukbot.1
      - name: Generate checksums
        working-directory: dist
        run: sha256sum pukbot-* pukbot.1 >SHA256SUMS
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833
        with:
          tool: syft
      - name: Generate SBOM
        run: syft scan dir:dist --output cyclonedx-json=dist/pukbot-sbom.cdx.json
      - name: Attest release binaries
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/pukbot-*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: Pukbot ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
