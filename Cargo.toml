[package]
name = "gitbot"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Post disclosed GitHub comments through the Gitbot GitHub App"
license = "MIT"
repository = "https://github.com/pulkitxm/Gitbot"
homepage = "https://gitbot.pulkit.page"
readme = "README.md"
keywords = ["github", "bot", "comments", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
