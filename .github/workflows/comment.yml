name: Comment
run-name: Gitbot comment ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      owner:
        description: Repository owner
        required: true
        type: string
      repository:
        description: Repository name
        required: true
        type: string
      number:
        description: Issue or pull request number
        required: true
        type: string
      body:
        description: Comment body
        required: true
        type: string
      requester:
        description: Authenticated requester
        required: false
        type: string
      request_id:
        description: CLI request identifier
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: comment-${{ inputs.owner }}-${{ inputs.repository }}-${{ inputs.number }}
  cancel-in-progress: false

jobs:
  comment:
    name: Post comment
    runs-on: ubuntu-latest
    environment: pukbot-production
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ inputs.owner }}
          repositories: ${{ inputs.repository }}
          permission-issues: write
          permission-pull-requests: write
      - name: Post disclosed comment
        env:
          BODY: ${{ inputs.body }}
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ inputs.number }}
          OWNER: ${{ inputs.owner }}
          REPOSITORY: ${{ inputs.repository }}
          REQUESTER: ${{ inputs.requester }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "${OWNER}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${REPOSITORY}" =~ ^[A-Za-z0-9_.-]+$ ]]
          [[ "${NUMBER}" =~ ^[1-9][0-9]*$ ]]
          [[ "${REQUEST_ID}" =~ ^[0-9-]*$ ]]
          test -z "${REQUESTER}" || test "${REQUESTER}" = "${ACTOR}"
          test -n "${BODY//[[:space:]]/}"
          test "${#BODY}" -le 40000
          footer='*Automated comment posted by Gitbot from an agent-assisted workflow.*'
          attribution="from: @${ACTOR}"
          printf '%s' "${BODY}" >body.md
          if ! grep -Fq -- "${footer}" body.md; then
            printf '\n\n---\n\n%s\n' "${footer}" >>body.md
          fi
          if ! grep -Fq -- "${attribution}" body.md; then
            printf '\n%s\n' "${attribution}" >>body.md
          fi
          jq -n --rawfile body body.md '{body: $body}' >request.json
          comment_url=$(gh api --method POST \
            "repos/${OWNER}/${REPOSITORY}/issues/${NUMBER}/comments" \
            --input request.json --jq .html_url)
          echo "gitbot-comment-url=${comment_url}"
