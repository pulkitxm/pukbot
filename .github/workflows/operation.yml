name: Operation
run-name: Pukbot operation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Typed operation JSON
        required: true
        type: string
      requester:
        description: Authenticated requester
        required: true
        type: string
      request_id:
        description: CLI request identifier
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: operation-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  operation:
    name: Execute operation
    runs-on: ubuntu-latest
    environment: pukbot-production
    steps:
      - id: app-token
        if: ${{ !startsWith(fromJSON(inputs.payload).operation, 'workflow_') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ fromJSON(inputs.payload).owner }}
          repositories: ${{ fromJSON(inputs.payload).repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: workflow-token
        if: ${{ startsWith(fromJSON(inputs.payload).operation, 'workflow_') }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: ${{ fromJSON(inputs.payload).owner }}
          repositories: ${{ fromJSON(inputs.payload).repository }}
          permission-actions: write
      - name: Execute typed operation
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ steps.app-token.outputs.token || steps.workflow-token.outputs.token }}
          PAYLOAD: ${{ inputs.payload }}
          REQUESTER: ${{ inputs.requester }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          [[ "${REQUEST_ID}" =~ ^[0-9-]+$ ]]
          test "${REQUESTER}" = "${ACTOR}"
          printf '%s' "${PAYLOAD}" >payload.json
          owner=$(jq -er '.owner | select(test("^[A-Za-z0-9_.-]+$"))' payload.json)
          repository=$(jq -er '.repository | select(test("^[A-Za-z0-9_.-]+$"))' payload.json)
          slug="${owner}/${repository}"
          operation=$(jq -er '.operation' payload.json)
          footer='*Automated comment posted by Pukbot from an agent-assisted workflow.*'
          attribution="from: @${ACTOR}"
          case "${operation}" in
            comment_create)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq -er '.body | select(length > 0 and length <= 40000)' payload.json >body.txt
              printf '\n\n---\n\n%s\n\n%s\n' "${footer}" "${attribution}" >>body.txt
              jq -n --rawfile body body.txt '{body: $body}' >request.json
              result=$(gh api --method POST "repos/${slug}/issues/${number}/comments" --input request.json --jq .html_url)
              ;;
            comment_edit)
              comment_id=$(jq -er '.comment_id | select(. >= 1)' payload.json)
              jq -er '.body | select(length > 0 and length <= 40000)' payload.json >body.txt
              printf '\n\n---\n\n%s\n\n%s\n' "${footer}" "${attribution}" >>body.txt
              jq -n --rawfile body body.txt '{body: $body}' >request.json
              result=$(gh api --method PATCH "repos/${slug}/issues/comments/${comment_id}" --input request.json --jq .html_url)
              ;;
            comment_delete)
              comment_id=$(jq -er '.comment_id | select(. >= 1)' payload.json)
              result=$(gh api "repos/${slug}/issues/comments/${comment_id}" --jq .html_url)
              gh api --method DELETE "repos/${slug}/issues/comments/${comment_id}"
              ;;
            comment_react)
              comment_id=$(jq -er '.comment_id | select(. >= 1)' payload.json)
              reaction=$(jq -er \
                '.reaction | select(
                  . == "+1" or . == "-1" or . == "laugh" or . == "confused" or
                  . == "heart" or . == "hooray" or . == "rocket" or . == "eyes"
                )' \
                payload.json)
              jq -n --arg content "${reaction}" '{content: $content}' >request.json
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/${slug}/issues/comments/${comment_id}/reactions" \
                --input request.json >/dev/null
              result=$(gh api "repos/${slug}/issues/comments/${comment_id}" --jq .html_url)
              ;;
            issue_create)
              jq '{title, body, labels, assignees} | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method POST "repos/${slug}/issues" --input request.json --jq .html_url)
              ;;
            issue_edit)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq '{title, body} | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method PATCH "repos/${slug}/issues/${number}" --input request.json --jq .html_url)
              ;;
            issue_close | issue_reopen)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              state=open
              if [ "${operation}" = issue_close ]; then state=closed; fi
              jq -n --arg state "${state}" '{state: $state}' >request.json
              result=$(gh api --method PATCH "repos/${slug}/issues/${number}" --input request.json --jq .html_url)
              ;;
            issue_labels)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq '{labels: .add}' payload.json >request.json
              if [ "$(jq '.labels | length' request.json)" -gt 0 ]; then
                gh api --method POST "repos/${slug}/issues/${number}/labels" --input request.json >/dev/null
              fi
              jq -r '.remove[]' payload.json | while IFS= read -r label; do
                encoded=$(jq -rn --arg value "${label}" '$value | @uri')
                gh api --method DELETE "repos/${slug}/issues/${number}/labels/${encoded}" >/dev/null
              done
              result="https://github.com/${slug}/issues/${number}"
              ;;
            issue_assignees)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq '{assignees: .add}' payload.json >request.json
              if [ "$(jq '.assignees | length' request.json)" -gt 0 ]; then
                gh api --method POST "repos/${slug}/issues/${number}/assignees" --input request.json >/dev/null
              fi
              jq '{assignees: .remove}' payload.json >request.json
              if [ "$(jq '.assignees | length' request.json)" -gt 0 ]; then
                gh api --method DELETE "repos/${slug}/issues/${number}/assignees" --input request.json >/dev/null
              fi
              result="https://github.com/${slug}/issues/${number}"
              ;;
            issue_react)
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              reaction=$(jq -er \
                '.reaction | select(
                  . == "+1" or . == "-1" or . == "laugh" or . == "confused" or
                  . == "heart" or . == "hooray" or . == "rocket" or . == "eyes"
                )' \
                payload.json)
              jq -n --arg content "${reaction}" '{content: $content}' >request.json
              gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                "repos/${slug}/issues/${number}/reactions" \
                --input request.json >/dev/null
              result="https://github.com/${slug}/issues/${number}"
              ;;
            pull_request_create)
              test "$(jq -r '.as_app' payload.json)" = true
              jq '{title, body, head, base, draft} | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method POST "repos/${slug}/pulls" --input request.json --jq .html_url)
              ;;
            pull_request_edit)
              test "$(jq -r '.as_app' payload.json)" = true
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq '{title, body, base} | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method PATCH "repos/${slug}/pulls/${number}" --input request.json --jq .html_url)
              ;;
            pull_request_merge)
              test "$(jq -r '.as_app' payload.json)" = true
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              title=$(gh api "repos/${slug}/pulls/${number}" --jq .title)
              commit_title="${title} (#${number})"
              jq -n --arg title "${commit_title}" \
                '{merge_method: "squash", commit_title: $title, commit_message: ""}' >request.json
              gh api --method PUT "repos/${slug}/pulls/${number}/merge" --input request.json >/dev/null
              result="https://github.com/${slug}/pull/${number}"
              ;;
            pull_request_review)
              test "$(jq -r '.as_app' payload.json)" = true
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              event=$(jq -er '.event | select(. == "approve" or . == "request_changes" or . == "comment")' payload.json)
              if [ "${event}" = approve ]; then event=APPROVE; fi
              if [ "${event}" = request_changes ]; then event=REQUEST_CHANGES; fi
              if [ "${event}" = comment ]; then event=COMMENT; fi
              jq --arg event "${event}" '{event: $event, body} | with_entries(select(.value != null))' payload.json >request.json
              gh api --method POST "repos/${slug}/pulls/${number}/reviews" --input request.json >/dev/null
              result="https://github.com/${slug}/pull/${number}"
              ;;
            pull_request_update_branch)
              test "$(jq -r '.as_app' payload.json)" = true
              number=$(jq -er '.number | select(. >= 1)' payload.json)
              jq -n '{}' >request.json
              gh api --method PUT "repos/${slug}/pulls/${number}/update-branch" --input request.json >/dev/null
              result="https://github.com/${slug}/pull/${number}"
              ;;
            commit_create)
              branch=$(jq -er '.branch | select(test("^[^\n\r]{1,255}$"))' payload.json)
              jq -j '.message' payload.json >message.txt
              base_sha=$(gh api "repos/${slug}/git/ref/heads/${branch}" --jq .object.sha)
              base_tree=$(gh api "repos/${slug}/git/commits/${base_sha}" --jq .tree.sha)
              entries='[]'
              count=$(jq '.files | length' payload.json)
              for i in $(seq 0 $((count - 1))); do
                path=$(jq -er ".files[$i].path" payload.json)
                delete=$(jq -r ".files[$i].delete" payload.json)
                if [ "${delete}" = "true" ]; then
                  entry=$(jq -n --arg path "${path}" '{path: $path, mode: "100644", type: "blob", sha: null}')
                else
                  jq -j ".files[$i].content" payload.json >content.txt
                  blob_sha=$(gh api --method POST "repos/${slug}/git/blobs" -F content=@content.txt -f encoding=utf-8 --jq .sha)
                  entry=$(jq -n --arg path "${path}" --arg sha "${blob_sha}" '{path: $path, mode: "100644", type: "blob", sha: $sha}')
                fi
                entries=$(jq -c --argjson entry "${entry}" '. + [$entry]' <<<"${entries}")
              done
              tree_sha=$(jq -n --arg base "${base_tree}" --argjson tree "${entries}" '{base_tree: $base, tree: $tree}' |
                gh api --method POST "repos/${slug}/git/trees" --input - --jq .sha)
              committer_login='pukbot[bot]'
              committer_id=$(gh api "users/pukbot%5Bbot%5D" --jq .id)
              committer_email="${committer_id}+${committer_login}@users.noreply.github.com"
              author_login=${ACTOR}
              if [ "$(jq -r '.as_app' payload.json)" = true ]; then author_login=${committer_login}; fi
              if [ "${author_login}" = "${committer_login}" ]; then
                author_name=${committer_login}
                author_id=${committer_id}
              else
                author_name=$(gh api "users/${author_login}" --jq '.name // .login')
                author_id=$(gh api "users/${author_login}" --jq .id)
              fi
              author_email="${author_id}+${author_login}@users.noreply.github.com"
              commit_sha=$(jq -n --rawfile msg message.txt --arg tree "${tree_sha}" \
                --arg parent "${base_sha}" --arg author_name "${author_name}" \
                --arg author_email "${author_email}" --arg committer_name "${committer_login}" \
                --arg committer_email "${committer_email}" \
                '{
                  message: $msg,
                  tree: $tree,
                  parents: [$parent],
                  author: {name: $author_name, email: $author_email},
                  committer: {name: $committer_name, email: $committer_email}
                }' |
                gh api --method POST "repos/${slug}/git/commits" --input - --jq .sha)
              gh api --method PATCH "repos/${slug}/git/refs/heads/${branch}" -f sha="${commit_sha}" -F force=false >/dev/null
              result="https://github.com/${slug}/commit/${commit_sha}"
              ;;
            wiki_publish)
              jq -j '.message' payload.json >message.txt
              source_ref=$(jq -r '.source_ref // empty' payload.json)
              source_path=$(jq -r '.source_path // empty' payload.json)
              replace=$(jq -r '.replace' payload.json)
              authenticated="https://x-access-token:${GH_TOKEN}@github.com"
              git clone --quiet "${authenticated}/${slug}.wiki.git" wiki
              if [ "${replace}" = true ]; then
                git -C wiki rm -q -r --ignore-unmatch .
              fi
              if [ -n "${source_ref}" ]; then
                git init -q source
                git -C source remote add origin "${authenticated}/${slug}.git"
                git -C source fetch --quiet --depth 1 origin "${source_ref}"
                git -C source checkout --quiet --detach FETCH_HEAD
                test -d "source/${source_path}"
                git -C source ls-files -z -- "${source_path}" >source-files
                file_count=$(tr -cd '\0' <source-files | wc -c)
                test "${file_count}" -ge 1
                test "${file_count}" -le 500
                total_bytes=0
                while IFS= read -r -d '' path; do
                  relative=${path}
                  if [ "${source_path}" != . ]; then
                    relative=${path#"${source_path}"/}
                    test "${relative}" != "${path}"
                  fi
                  test -n "${relative}"
                  test -f "source/${path}"
                  test ! -L "source/${path}"
                  total_bytes=$((total_bytes + $(wc -c <"source/${path}")))
                  test "${total_bytes}" -le 20000000
                  mkdir -p "wiki/$(dirname "${relative}")"
                  cp "source/${path}" "wiki/${relative}"
                done <source-files
              fi
              while IFS= read -r path; do
                test -z "${path}" || rm -f -- "wiki/${path}"
              done < <(jq -r '.delete[]' payload.json)
              git -C wiki add -A
              test -n "$(git -C wiki status --porcelain)"
              committer_login='pukbot[bot]'
              committer_id=$(gh api "users/pukbot%5Bbot%5D" --jq .id)
              git -C wiki config user.name "${committer_login}"
              git -C wiki config user.email "${committer_id}+${committer_login}@users.noreply.github.com"
              git -C wiki commit -q -F ../message.txt
              git -C wiki push -q origin HEAD
              result="https://github.com/${slug}/wiki"
              ;;
            repository_dispatch)
              jq '{event_type, client_payload}' payload.json >request.json
              gh api --method POST "repos/${slug}/dispatches" --input request.json >/dev/null
              result="https://github.com/${slug}/actions"
              ;;
            ref_create)
              reference=$(jq -er '.ref | select(startswith("refs/") and length <= 260)' payload.json)
              sha=$(jq -er '.sha | select(test("^[0-9A-Fa-f]{40}$"))' payload.json)
              jq -n --arg ref "${reference}" --arg sha "${sha}" '{ref: $ref, sha: $sha}' >request.json
              gh api --method POST "repos/${slug}/git/refs" --input request.json >/dev/null
              result="https://github.com/${slug}"
              if [[ "${reference}" = refs/heads/* ]]; then
                branch=${reference#refs/heads/}
                encoded_branch=$(jq -rn --arg value "${branch}" '$value | @uri')
                result="https://github.com/${slug}/tree/${encoded_branch}"
              elif [[ "${reference}" = refs/tags/* ]]; then
                tag=${reference#refs/tags/}
                encoded_tag=$(jq -rn --arg value "${tag}" '$value | @uri')
                result="https://github.com/${slug}/tree/${encoded_tag}"
              fi
              ;;
            ref_delete)
              reference=$(jq -er '.ref | select(startswith("refs/") and length <= 260)' payload.json)
              short_ref=${reference#refs/}
              encoded_ref=$(jq -rn --arg value "${short_ref}" '$value | @uri')
              gh api --method DELETE "repos/${slug}/git/refs/${encoded_ref}" >/dev/null
              result="https://github.com/${slug}"
              ;;
            tag_create)
              tag=$(jq -er '.tag | select(length > 0 and length <= 255)' payload.json)
              target=$(jq -er '.target | select(test("^[0-9A-Fa-f]{40}$"))' payload.json)
              message=$(jq -r '.message // empty' payload.json)
              if [ -n "${message}" ]; then
                tagger_login='pukbot[bot]'
                tagger_id=$(gh api "users/pukbot%5Bbot%5D" --jq .id)
                tagger_email="${tagger_id}+${tagger_login}@users.noreply.github.com"
                jq -n --arg tag "${tag}" --arg message "${message}" --arg object "${target}" \
                  --arg name "${tagger_login}" --arg email "${tagger_email}" \
                  '{tag: $tag, message: $message, object: $object, type: "commit", tagger: {name: $name, email: $email}}' \
                  >request.json
                target=$(gh api --method POST "repos/${slug}/git/tags" --input request.json --jq .sha)
              fi
              reference="refs/tags/${tag}"
              jq -n --arg ref "${reference}" --arg sha "${target}" '{ref: $ref, sha: $sha}' >request.json
              gh api --method POST "repos/${slug}/git/refs" --input request.json >/dev/null
              encoded_tag=$(jq -rn --arg value "${tag}" '$value | @uri')
              result="https://github.com/${slug}/tree/${encoded_tag}"
              ;;
            tag_delete)
              tag=$(jq -er '.tag | select(length > 0 and length <= 255)' payload.json)
              encoded_tag=$(jq -rn --arg value "${tag}" '$value | @uri')
              gh api --method DELETE "repos/${slug}/git/refs/tags/${encoded_tag}" >/dev/null
              result="https://github.com/${slug}/tags"
              ;;
            release_create)
              jq '{
                tag_name: .tag,
                name,
                body,
                target_commitish: .target,
                draft,
                prerelease,
                generate_release_notes: .generate_notes
              } | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method POST "repos/${slug}/releases" --input request.json --jq .html_url)
              ;;
            release_edit)
              release_id=$(jq -er '.release_id | select(. >= 1)' payload.json)
              jq '{
                tag_name: .tag,
                name,
                body,
                draft,
                prerelease,
                make_latest
              } | with_entries(select(.value != null))' payload.json >request.json
              result=$(gh api --method PATCH "repos/${slug}/releases/${release_id}" --input request.json --jq .html_url)
              ;;
            release_delete)
              release_id=$(jq -er '.release_id | select(. >= 1)' payload.json)
              result=$(gh api "repos/${slug}/releases/${release_id}" --jq .html_url)
              gh api --method DELETE "repos/${slug}/releases/${release_id}" >/dev/null
              ;;
            release_asset_upload)
              release_id=$(jq -er '.release_id | select(. >= 1)' payload.json)
              name=$(jq -er '.name | select(length > 0 and length <= 255)' payload.json)
              label=$(jq -r '.label // empty' payload.json)
              content_type=$(jq -er '.content_type | select(length > 0 and length <= 255)' payload.json)
              jq -j '.content_base64' payload.json | base64 --decode >asset.bin
              test -s asset.bin
              test "$(wc -c <asset.bin)" -le 40000
              upload_url=$(gh api "repos/${slug}/releases/${release_id}" --jq '.upload_url | sub("\\{.*"; "")')
              encoded_name=$(jq -rn --arg value "${name}" '$value | @uri')
              endpoint="${upload_url}?name=${encoded_name}"
              if [ -n "${label}" ]; then
                encoded_label=$(jq -rn --arg value "${label}" '$value | @uri')
                endpoint="${endpoint}&label=${encoded_label}"
              fi
              result=$(curl --fail-with-body --silent --show-error --location \
                --request POST \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer ${GH_TOKEN}" \
                --header 'X-GitHub-Api-Version: 2026-03-10' \
                --header "Content-Type: ${content_type}" \
                --data-binary @asset.bin "${endpoint}" | jq -er .browser_download_url)
              ;;
            workflow_dispatch)
              workflow=$(jq -er \
                '.workflow | select(test("^[A-Za-z0-9_.-]{1,255}$") and . != "." and . != "..")' \
                payload.json)
              encoded_workflow=$(jq -rn --arg value "${workflow}" '$value | @uri')
              jq '{ref, inputs}' payload.json >request.json
              result=$(gh api --method POST \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/${slug}/actions/workflows/${encoded_workflow}/dispatches" \
                --input request.json --jq .html_url)
              ;;
            workflow_cancel)
              run_id=$(jq -er '.run_id | select(. >= 1)' payload.json)
              gh api --method POST "repos/${slug}/actions/runs/${run_id}/cancel" >/dev/null
              result="https://github.com/${slug}/actions/runs/${run_id}"
              ;;
            workflow_rerun)
              run_id=$(jq -er '.run_id | select(. >= 1)' payload.json)
              route=rerun
              if [ "$(jq -r '.failed_only' payload.json)" = true ]; then route=rerun-failed-jobs; fi
              gh api --method POST "repos/${slug}/actions/runs/${run_id}/${route}" >/dev/null
              result="https://github.com/${slug}/actions/runs/${run_id}"
              ;;
            workflow_enable | workflow_disable)
              workflow=$(jq -er \
                '.workflow | select(test("^[A-Za-z0-9_.-]{1,255}$") and . != "." and . != "..")' \
                payload.json)
              encoded_workflow=$(jq -rn --arg value "${workflow}" '$value | @uri')
              route=enable
              if [ "${operation}" = workflow_disable ]; then route=disable; fi
              gh api --method PUT "repos/${slug}/actions/workflows/${encoded_workflow}/${route}" >/dev/null
              result="https://github.com/${slug}/actions/workflows/${encoded_workflow}"
              ;;
            *)
              printf 'unsupported operation: %s\n' "${operation}" >&2
              exit 1
              ;;
          esac
          echo "pukbot-result-url=${result}"
